services:
  - type: web
    name: gramshiksha-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: JWT_AUDIENCE
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
